# Three services and one job: model host, API, web.
#
# No authentication, no TLS, no secrets, and no persistence beyond the model
# cache: an uploaded CV lives in memory for the length of a request. This is a
# local demo, and every one of those omissions is deliberate — see "Not
# included" in the README before pointing it at anything real.

services:
  # Opt-in, via `--profile bundled`. Docker Desktop on macOS runs a Linux VM
  # with no Metal passthrough, so ollama in a container is CPU-only: measured
  # at 3.5 tok/s here against 99.7 tok/s on the host, a 28x difference that
  # turns a 20-second screening run into ten minutes. Use this profile on
  # Linux, in CI, or anywhere there is no ollama on the host.
  ollama:
    image: ollama/ollama:latest
    profiles: ["bundled"]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # A one-shot job, not a service: it pulls the models into the shared volume
  # and exits. The API waits for it to complete successfully, so the first
  # request never races a half-downloaded model.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["bundled"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:3b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'ollama pull "$${EMBED_MODEL}" && ollama pull "$${CHAT_MODEL}"'
    restart: "no"

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    # host.docker.internal reaches the ollama already running on your machine,
    # which has the GPU. Point this at http://ollama:11434 (and add
    # `--profile bundled`) to use the containerised, CPU-only one instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:3b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      # Generous: a cold model load is slow, and a timeout here would surface
      # as a 503 that looks like a bug rather than a cold start.
      OLLAMA_TIMEOUT: "600"
      TOP_K: "3"
      # OFFLINE=true serves the deterministic fake backend — the whole stack
      # comes up with no model at all, which is how you test the wiring.
      OFFLINE: ${OFFLINE:-false}

  web:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this is a host address, not
        # a compose service name — `http://api:8000` would not resolve in a
        # browser outside the compose network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ollama-models:
